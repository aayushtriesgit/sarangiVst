name: Build Sarangi plugin

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: |
          if [ -f CMakeLists.txt ]; then echo "SRC=." >> $GITHUB_ENV; else echo "SRC=$(dirname "$(ls */CMakeLists.txt | head -1)")" >> $GITHUB_ENV; fi
      - name: Configure
        run: cmake -S "$SRC" -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Sarangi-Windows-VST3
          path: build/Sarangi_artefacts/Release/VST3/Sarangi.vst3

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder
        run: |
          if [ -f CMakeLists.txt ]; then echo "SRC=." >> $GITHUB_ENV; else echo "SRC=$(dirname "$(ls */CMakeLists.txt | head -1)")" >> $GITHUB_ENV; fi
      - name: Configure
        run: cmake -S "$SRC" -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3 and AU
        uses: actions/upload-artifact@v4
        with:
          name: Sarangi-macOS
          path: |
            build/Sarangi_artefacts/Release/VST3/Sarangi.vst3
            build/Sarangi_artefacts/Release/AU/Sarangi.component
